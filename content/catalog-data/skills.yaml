  actions: [{ kind: copyDir, source: skills/receiving-code-review, target: "{skillsDir}/receiving-code-review" }]
- id: using-git-worktrees
  name: using-git-worktrees
  group: core
  description: Detect-then-create isolated workspace logic; dependency installs ask for confirmation first.
  defaultChecked: true
  actions: [{ kind: copyDir, source: skills/using-git-worktrees, target: "{skillsDir}/using-git-worktrees" }]
- id: dispatching-parallel-agents
  name: dispatching-parallel-agents
