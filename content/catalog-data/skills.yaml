- id: using-superpowers
  name: using-superpowers
  group: core
  description: Enforcement rule that makes every other skill get invoked. Always installed, never a wizard choice.
  defaultChecked: true
  forced: true
  actions: [{ kind: copyDir, source: skills/using-superpowers, target: "{skillsDir}/using-superpowers" }]
- id: brainstorming
  name: brainstorming
  group: core
  description: >-
    Design-and-approval gate before any implementation. Adapted from upstream: for a redesign/rebuild
    spec, splits audit/findings evidence into a companion doc instead of interleaving it with the
    forward-looking design.
  defaultChecked: true
  actions: [{ kind: copyDir, source: skills/brainstorming, target: "{skillsDir}/brainstorming" }]
- id: writing-plans
  name: writing-plans
  group: core
  description: >-
    Turns an approved spec into a bite-sized, zero-context-assumed implementation plan. Adapted from
    upstream: splits large multi-milestone plans (8+ tasks or ~20KB+) into a directory of per-milestone
    files instead of one monolithic plan file.
  defaultChecked: true
  actions: [{ kind: copyDir, source: skills/writing-plans, target: "{skillsDir}/writing-plans" }]
- id: executing-plans
  name: executing-plans
  group: core
  description: Implements a written plan task by task in the current session, then a final whole-branch review.
  defaultChecked: true
  actions: [{ kind: copyDir, source: skills/executing-plans, target: "{skillsDir}/executing-plans" }]
- id: test-driven-development
  name: test-driven-development
  group: core
  description: Red-Green-Refactor iron law — no production code before a failing test.
  defaultChecked: true
  actions: [{ kind: copyDir, source: skills/test-driven-development, target: "{skillsDir}/test-driven-development" }]
- id: systematic-debugging
  name: systematic-debugging
  group: core
  description: Four-phase root-cause-first debugging gate.
  defaultChecked: true
  actions: [{ kind: copyDir, source: skills/systematic-debugging, target: "{skillsDir}/systematic-debugging" }]
- id: verification-before-completion
  name: verification-before-completion
  group: core
  description: No completion claims without fresh verification evidence in the same response.
  defaultChecked: true
  actions: [{ kind: copyDir, source: skills/verification-before-completion, target: "{skillsDir}/verification-before-completion" }]
- id: requesting-code-review
  name: requesting-code-review
  group: core
  description: Dispatches a reviewer subagent with precisely-scoped context.
  defaultChecked: true
  actions: [{ kind: copyDir, source: skills/requesting-code-review, target: "{skillsDir}/requesting-code-review" }]
- id: receiving-code-review
  name: receiving-code-review
  group: core
